<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Planet data table</title>
    <link href="stylesheet.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!-- Giving the table tag along with the --> 
    <table>
      <h1><b>Planet data table</b></h1>
      <caption>Data about the planets of our solar system 
      (Planetary facts taken from Nasa's Planetary Fact Sheet - Metric).</caption>
      <rowspan>
        <th>
          <td><b>Name</b></td>
          <td><b>Mass (10<sup>24</sup>kg)</b></td>
          <td><b>Diameter (km)</b></td>
          <td><b>Density (kg/m<sup>3</sup>)</b></td>
          <td><b>Gravity(m/s<sub>2</sub>)</b></td>
          <td><b>Length of days (hours)</b></td>
          <td><b>Distacne from Sun (10<sup>6</sup></b>)</td>
          <td><b>Mean temprature(C)</b></td>
          <td><b>Number of Moons</b></td>
          <td><b>Notes</b></td>
        </th>
      </rowspan>
    
    </table>
  </body>
</html>
